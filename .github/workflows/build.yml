name: Build

# Builds kwxGO's own library plus the generated bindings, then builds
# tests/quick_port. No wxUiEditor binary and no checked-in generated tree is
# required: the port is the hand-written reference and the bindings come from
# kwxgen, which is built from the sibling kwxFFI checkout.
#
# The compiler is the same msys64 clang64 clang the local lane uses. cgo is
# pinned to it: kwxGO's build_quick_port.cmd sets CC/CXX to that absolute path,
# and a lane that cannot compile must fail this job, never be skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-kwxgo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: library and quick port
    runs-on: windows-2025-vs2026
    timeout-minutes: 350
    env:
      CI: true
    steps:
      - name: Checkout kwxGO
        uses: actions/checkout@v7
        with:
          path: kwxGO

      - name: Checkout kwxFFI (sibling sources, headers, kwxgen)
        uses: actions/checkout@v7
        with:
          repository: KeyWorksRW/kwxFFI
          path: kwxFFI

      - name: Setup CMake 4.2+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~4.2.0'
          ninjaVersion: 'latest'

      - name: Setup MSYS2 toolchain (clang64)
        shell: pwsh
        run: |
          $msys_bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $msys_bash)) {
            choco install msys2 --params="/InstallDir:C:\msys64" -y --no-progress
          }
          if (-not (Test-Path $msys_bash)) {
            throw "MSYS2 is not installed at C:\msys64."
          }
          & $msys_bash -lc "pacman -Sy --noconfirm --needed mingw-w64-clang-x86_64-toolchain"
          if ($LASTEXITCODE -ne 0) { throw "pacman failed (exit $LASTEXITCODE)." }
          "C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pin the cgo toolchain to the local lane's clang
        shell: pwsh
        run: |
          $clang = 'C:\msys64\clang64\bin\clang.exe'
          if (-not (Test-Path $clang)) {
            throw "cgo pin: '$clang' is missing; build_quick_port.cmd hardcodes it for CC/CXX."
          }
          $first = (& $clang --version | Select-Object -First 1)
          if ($first -notmatch '^clang version 21\.') {
            throw "cgo pin: expected clang 21 from msys64 clang64 (the version the local Go lane uses), got '$first'. Refusing to run the Go lane on a different compiler."
          }
          Write-Host "cgo pinned to $clang ($first)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Configure
        working-directory: kwxGO
        run: cmake --preset ninja-clang

      - name: Build library and bindings (Debug)
        working-directory: kwxGO
        run: cmake --build build --config Debug

      - name: Build tests/quick_port when present
        working-directory: kwxGO
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d tests/quick_port ]; then
            echo "tests/quick_port is not present; nothing to build."
            exit 0
          fi
          ./build_quick_port.cmd
